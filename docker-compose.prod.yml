version: "3.9"
services:
  db:
    image: postgres:16
    container_name: sanmahot-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sanmahot

  redis:
    image: redis:7-alpine
    container_name: sanmahot-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - sanmahot

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sanmahot-rails
    restart: always
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ACCESSTRADE_API_KEY: ${ACCESSTRADE_API_KEY}
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      - db
      - redis
    networks:
      - sanmahot

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sanmahot-worker
    restart: always
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ACCESSTRADE_API_KEY: ${ACCESSTRADE_API_KEY}
      RAILS_LOG_TO_STDOUT: "true"
    depends_on:
      - db
      - redis
    networks:
      - sanmahot

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sanmahot-frontend
    restart: always
    networks:
      - sanmahot

  nginx:
    image: nginx:alpine
    container_name: sanmahot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
      - frontend
    networks:
      - sanmahot

networks:
  sanmahot:
    driver: bridge

volumes:
  pg_data:
  redis_data:
