version: "3.3"
services:
  db:
    image: postgres:16
    container_name: sanmahot-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sanmahot_development
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
    container_name: sanmahot-rails
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0"
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    shm_size: "2gb"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/sanmahot_development
      RAILS_ENV: development
      POSTGRES_PASSWORD: 123456
      REDIS_URL: redis://redis:6379/1
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: sanmahot-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host

  redis:
    image: redis:7-alpine
    container_name: sanmahot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: ./backend
    container_name: sanmahot-worker
    command: bundle exec sidekiq
    volumes:
      - ./backend:/app
    shm_size: "2gb"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:123456@db:5432/sanmahot_development
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/1
      POSTGRES_PASSWORD: 123456
    env_file:
      - ./backend/.env

volumes:
  pg_data:
  redis_data:
